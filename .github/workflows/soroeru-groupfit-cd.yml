# ソロエルを Cloud Run へデプロイする CD。
#
# ■ 現在の状態: 自動デプロイはオン
#   main への push でテスト → デプロイまで走る。
#   ドキュメントだけの変更（*.md / docs/）ではデプロイしない。
#   Actions タブからの手動実行もできる（deploy を false にするとテストだけ流す）。
#
# ■ 止めたいとき
#   GitHub の Actions タブ → このワークフロー → 右上 "..." → Disable workflow。
#   ファイルを消さずに止められる。恒久的に止めるなら下の `push:` を消す。
#
# ■ 認証情報（リポジトリ変数）は DEPLOY.md「C. GitHub Actions」を参照

name: soroeru-groupfit CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "_memo/**"

  workflow_dispatch:
    inputs:
      deploy:
        description: "デプロイまで実行する（false ならテストのみ）"
        type: boolean
        default: true

env:
  PROJECT_ID: soroeru-groupfit
  REGION: asia-northeast1
  SERVICE: soroeru-groupfit
  BUCKET: soroeru-groupfit-images
  RUN_SERVICE_ACCOUNT: soroeru-run@soroeru-groupfit.iam.gserviceaccount.com

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # データ管理が Firestore 既定のため、エミュレータを立てて本番と同じ経路で流す。
      # ローカルと同じ compose を使うので、CI 専用の環境定義を持たない。
      - name: Firestore エミュレータを起動
        run: docker compose up -d firestore

      - name: pytest
        run: docker compose run --rm api python -m pytest -q

      - name: 後片付け
        if: always()
        run: docker compose down -v

  deploy:
    name: Cloud Run へデプロイ
    needs: test
    runs-on: ubuntu-latest
    # push は常にデプロイ。手動実行は deploy を選んだときだけ。
    if: github.event_name == 'push' || inputs.deploy
    permissions:
      contents: read
      id-token: write # Workload Identity Federation に必要
    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud に認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 集合プレビューと記念ムービーの生成に時間がかかるため、タイムアウトとメモリを上げてある。
      # 実キーは Secret Manager から注入する（イメージにもリポジトリにも入れない）。
      - name: デプロイ
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUN_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --timeout 300 \
            --memory 1Gi \
            --set-env-vars "APP_ENV=prod,DB_DRIVER=firestore,STORAGE_DRIVER=gcs,GCS_BUCKET=$BUCKET,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,NOTIFY_CHANNEL=in_app,GEMINI_MODE=live,YOUCAM_MODE=live,GEMINI_MODEL=gemini-3.7-flash" \
            --set-secrets "GEMINI_API_KEY=gemini-api-key:latest,YOUCAM_API_KEY=youcam-api-key:latest" \
            --quiet

      # 招待URLと集合プレビューのURL生成に使うため、確定したURLを流し込む
      - name: PUBLIC_BASE_URL を反映
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --update-env-vars "PUBLIC_BASE_URL=$URL" \
            --quiet
          echo "URL=$URL" >> "$GITHUB_ENV"

      - name: 起動確認（/healthz）
        run: |
          echo "デプロイ先: $URL"
          BODY=$(curl -sSf --retry 5 --retry-delay 3 "$URL/healthz" | tee /dev/stderr)
          echo "$BODY" | grep -q '"status":"ok"'
          # 環境変数の設定漏れを検知する（本番はクラウド側と実APIを向く）
          echo "$BODY" | grep -q '"db":"firestore"'
          echo "$BODY" | grep -q '"storage":"gcs"'
          echo "$BODY" | grep -q '"gemini":"live"'
          echo "$BODY" | grep -q '"youcam":"live"'
          echo "### デプロイ完了: $URL" >> "$GITHUB_STEP_SUMMARY"
