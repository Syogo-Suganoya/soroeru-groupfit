# ソロエル（gcp_hack/soroeru-groupfit）を Cloud Run へデプロイする CD。
#
# ■ 現在の状態: 自動デプロイはオフ
#   push では起動しない。手動実行（Actions タブの "Run workflow"）だけができる。
#   さらに安全側に倒すため、環境変数 CD_ENABLED が "true" でなければ
#   デプロイ手前で停止する（テストだけ流して終わる）。
#
# ■ オンにする手順
#   1. GitHub の Settings > Secrets and variables > Actions > Variables で
#      CD_ENABLED = true を作る（これだけで手動デプロイが通るようになる）
#   2. main への push でも動かしたいときは、下の `push:` のコメントを外す
#   3. 認証情報（Variables）は DEPLOY.md「C. GitHub Actions」を参照
#
# ■ オフに戻す手順
#   CD_ENABLED を false にする（または変数ごと削除する）。
#   push トリガーを付けている場合はコメントに戻す。

name: soroeru-groupfit CD

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "デプロイまで実行する（false ならテストのみ）"
        type: boolean
        default: false

  # ↓ 自動デプロイをオンにするときにコメントを外す
  # push:
  #   branches: [main]
  #   paths:
  #     - "gcp_hack/soroeru-groupfit/**"
  #     - ".github/workflows/soroeru-groupfit-cd.yml"

env:
  PROJECT_ID: soroeru-groupfit
  REGION: asia-northeast1
  SERVICE: soroeru-groupfit
  BUCKET: soroeru-groupfit-images
  RUN_SERVICE_ACCOUNT: soroeru-run@soroeru-groupfit.iam.gserviceaccount.com

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcp_hack/soroeru-groupfit
    steps:
      - uses: actions/checkout@v4

      # データ管理が Firestore 既定のため、エミュレータを立てて本番と同じ経路で流す。
      # ローカルと同じ compose を使うので、CI 専用の環境定義を持たない。
      - name: Firestore エミュレータを起動
        run: docker compose up -d firestore

      - name: pytest
        run: docker compose run --rm api python -m pytest -q

      - name: 後片付け
        if: always()
        run: docker compose down -v

  deploy:
    name: Cloud Run へデプロイ
    needs: test
    runs-on: ubuntu-latest
    # CD_ENABLED が true で、かつ手動実行時に deploy を選んだときだけ動く
    if: vars.CD_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy)
    permissions:
      contents: read
      id-token: write # Workload Identity Federation に必要
    defaults:
      run:
        working-directory: gcp_hack/soroeru-groupfit
    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud に認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 記念ムービーの生成に時間がかかるため、タイムアウトとメモリを上げてある
      - name: デプロイ
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUN_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --timeout 300 \
            --memory 1Gi \
            --set-env-vars "APP_ENV=prod,DB_DRIVER=firestore,STORAGE_DRIVER=gcs,GCS_BUCKET=$BUCKET,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,NOTIFY_CHANNEL=in_app,GEMINI_MODE=mock,YOUCAM_MODE=mock,GEMINI_MODEL=gemini-3.7-flash,COMPOSITOR_ENGINE=local,VIDEO_ENGINE=local" \
            --quiet

      # 招待URLと集合プレビューのURL生成に使うため、確定したURLを流し込む
      - name: PUBLIC_BASE_URL を反映
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')
          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --update-env-vars "PUBLIC_BASE_URL=$URL" \
            --quiet
          echo "URL=$URL" >> "$GITHUB_ENV"

      - name: 起動確認（/healthz）
        run: |
          echo "デプロイ先: $URL"
          BODY=$(curl -sSf --retry 5 --retry-delay 3 "$URL/healthz" | tee /dev/stderr)
          echo "$BODY" | grep -q '"status":"ok"'
          # 環境変数の設定漏れを検知する（本番はどちらもクラウド側を向く）
          echo "$BODY" | grep -q '"db":"firestore"'
          echo "$BODY" | grep -q '"storage":"gcs"'
          echo "### デプロイ完了: $URL" >> "$GITHUB_STEP_SUMMARY"
