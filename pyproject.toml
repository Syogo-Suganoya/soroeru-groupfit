[project]
name = "soroeru-groupfit"
version = "0.1.0"
description = "ソロエル — グループ集合試着エージェント"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.20",
    "httpx>=0.27",
    "Pillow>=11.0",
    # データ管理は Firestore が既定（開発時はエミュレータ）
    "google-cloud-firestore>=2.16",
]

[project.optional-dependencies]
# mock モードでは import されない。live 切替時のみ使用する。
gcp = [
    "google-genai>=0.5",
    "google-adk>=0.1",
    "google-cloud-storage>=2.19",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
