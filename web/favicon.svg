  <g>
    <circle cx="5.5" cy="11.2" r="2.4" fill="#ff6f61"/>
    <path d="M2.5 26v-8a3 3 0 0 1 6 0v8z" fill="#ff6f61"/>
    <circle cx="12.5" cy="11.2" r="2.4" fill="#3ecfa5"/>
    <path d="M9.5 26v-8a3 3 0 0 1 6 0v8z" fill="#3ecfa5"/>
    <circle cx="19.5" cy="11.2" r="2.4" fill="#5aa7e8"/>
    <path d="M16.5 26v-8a3 3 0 0 1 6 0v8z" fill="#5aa7e8"/>
    <circle cx="26.5" cy="11.2" r="2.4" fill="#f0b72f"/>
    <path d="M23.5 26v-8a3 3 0 0 1 6 0v8z" fill="#f0b72f"/>
  </g>
  <path d="M3 27.6h26" stroke="#453f3c" stroke-width="1.3" stroke-linecap="round"/>
</svg>
