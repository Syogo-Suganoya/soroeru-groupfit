<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ソロエル">
  <title>ソロエル</title>
  <!--
    4人が足もとを揃えて並ぶ。紹介ページの集合プレビューと同じ形と4色を使う。
    小さく表示されると肌色の頭は背景に溶けるため、頭も衣装と同じ色で塗る。
  -->
